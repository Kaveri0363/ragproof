[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragproof"
version = "0.1.0"
description = "An offline, reproducible evaluation harness for RAG pipelines — with a CI regression gate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Y V Satyasri Kaveri" }]
keywords = ["rag", "retrieval", "evaluation", "llm", "information-retrieval", "mlops"]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.2"]
llm = ["anthropic>=0.30", "openai>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
ragproof = "ragproof.cli:main"

[project.urls]
Homepage = "https://github.com/Kaveri0363/ragproof"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
